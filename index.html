<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labour Friends of USA</title>
<!-- Update this description whenever you change the event below — it controls link previews -->
<meta name="description" content="Join Labour Friends of USA for a midterm watch party in Central London on 3 November, 9pm–2am. Sign up here; £10 donation on the door.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="hero">
  <div class="container hero-inner">
    <h1>Labour Friends <br> of the USA</h1>
    <p class="hero-sub">We’re relaunching — join us!</p>

    <form class="signup-form" id="preregister-form" aria-labelledby="event-title signup-title">
      <section class="event-details" aria-labelledby="event-title">
        <h2 id="event-title"></h2>
        <p><strong id="event-datetime"></strong><br><span id="event-location"></span></p>
        <p class="event-donation" id="event-donation"></p>
      </section>

      <h2 id="signup-title">Your details</h2>
      <input type="hidden" name="event" id="event-field" value="">
      <p class="hidden-field" aria-hidden="true">
        <label>Leave this field blank: <input type="text" name="company" id="company" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="form-row">
        <label for="name" class="sr-only">Full name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required>
      </div>

      <div class="form-row">
        <label for="email" class="sr-only">Email address</label>
        <input type="email" id="email" name="email" placeholder="Email address" required>
      </div>

      <div class="form-row">
        <label for="phone" class="sr-only">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
      </div>

      <div class="form-row form-consent">
        <input type="checkbox" id="consent" name="consent" value="yes" required>
        <label for="consent">I consent to Labour Friends of USA storing my details to keep me updated.</label>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submit-btn"></button>
      <p class="form-error" id="form-error" hidden>Something went wrong — please try again.</p>
    </form>

    <p class="alt-link">Can't make it? <a href="register.html">Register your general interest instead</a></p>
  </div>
</main>

<script>
  // ---- Edit this block for each new event. Nothing else in this file needs to change. ----
  const EVENT = {
    name: "Midterm watch party",
    dateTime: "3 November · 9pm–2am",
    location: "Central London location",
    donation: "£10 donation on the door", // set to "" to hide this line
    ctaText: "Sign Up for the Event"
  };
  // ------------------------------------------------------------------------------------------

  document.getElementById('event-title').textContent = EVENT.name;
  document.getElementById('event-datetime').textContent = EVENT.dateTime;
  document.getElementById('event-location').textContent = EVENT.location;
  document.getElementById('event-field').value = EVENT.name;

  const donationEl = document.getElementById('event-donation');
  if (EVENT.donation) {
    donationEl.textContent = EVENT.donation;
  } else {
    donationEl.remove();
  }

  const submitBtn = document.getElementById('submit-btn');
  submitBtn.textContent = EVENT.ctaText;

  // Paste the URL you get from deploying the Google Apps Script (ends in /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKDBFHG2n8DYJcx58S91uv5Vl0VtOVpLHoI3PwBOSRqVzMYFhmmKj1LLZxQUhBbjUpUQ/exec";

  const form = document.getElementById('preregister-form');
  const errorMsg = document.getElementById('form-error');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // Honeypot: if this hidden field got filled in, it's a bot — drop silently
    if (form.company.value) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    errorMsg.hidden = true;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: new FormData(form)
    })
      .then(function () {
        const details = [EVENT.dateTime, EVENT.location, EVENT.donation].filter(Boolean).join(' · ');
        window.location.href = 'thank-you.html?event=' + encodeURIComponent(EVENT.name) + '&details=' + encodeURIComponent(details);
      })
      .catch(function () {
        errorMsg.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = EVENT.ctaText;
      });
  });
</script>

</body>
</html>
