<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labour Friends of USA</title>
<meta name="description" content="Signups for the Labour Friends of USA midterm watch party are now closed — we're at capacity! Register your general interest for future events.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="hero">
  <div class="container hero-inner">
    <h1>Labour Friends <br> of the USA</h1>
    <p class="hero-sub">We’re relaunching — join us!</p>

    <form class="signup-form" id="preregister-form">
      <p class="closed-message">Signups for our Midterm Watch Party are now closed — we're at capacity!<br>Register your interest in Labour Friends of USA here.</p>

      <p class="hidden-field" aria-hidden="true">
        <label>Leave this field blank: <input type="text" name="company" id="company" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="form-row">
        <label for="name" class="sr-only">Full name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required>
      </div>

      <div class="form-row">
        <label for="email" class="sr-only">Email address</label>
        <input type="email" id="email" name="email" placeholder="Email address" required>
      </div>

      <div class="form-row">
        <label for="phone" class="sr-only">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
      </div>

      <div class="form-row form-consent">
        <input type="checkbox" id="consent" name="consent" value="yes" required>
        <label for="consent">I consent to Labour Friends of USA storing my details to keep me updated.</label>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Register Interest</button>
      <p class="form-error" id="form-error" hidden>Something went wrong — please try again.</p>
    </form>
  </div>
</main>

<script>
  // Paste the URL you get from deploying the Google Apps Script (ends in /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKDBFHG2n8DYJcx58S91uv5Vl0VtOVpLHoI3PwBOSRqVzMYFhmmKj1LLZxQUhBbjUpUQ/exec";

  const form = document.getElementById('preregister-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorMsg = document.getElementById('form-error');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // Honeypot: if this hidden field got filled in, it's a bot — drop silently
    if (form.company.value) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    errorMsg.hidden = true;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: new FormData(form)
    })
      .then(function () {
        window.location.href = 'thank-you.html';
      })
      .catch(function () {
        errorMsg.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Interest';
      });
  });
</script>

</body>
</html>
