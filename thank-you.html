<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You &mdash; Labour Friends of USA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="hero">
  <div class="container hero-inner">
    <h1>Thank You</h1>
    <p class="hero-sub" id="thank-you-sub" hidden></p>
    <p id="thank-you-details" hidden></p>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </div>
</main>

<script>
  // Shows an event-specific confirmation when arriving from the event page's
  // signup redirect (?event=...&details=...). Falls back to a bare "Thank You"
  // for general-interest signups, with nothing else to configure here.
  const params = new URLSearchParams(window.location.search);
  const event = params.get('event');
  const details = params.get('details');

  if (event) {
    const subEl = document.getElementById('thank-you-sub');
    subEl.textContent = 'Thanks for signing up for ' + event + '!';
    subEl.hidden = false;
  }
  if (details) {
    const detailsEl = document.getElementById('thank-you-details');
    detailsEl.textContent = details;
    detailsEl.hidden = false;
  }
</script>

</body>
</html>
